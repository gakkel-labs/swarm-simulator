syntax = "proto3";

package gakkel;

option java_package = "fr.gakkel.swarmsimulator.contracts";
option java_multiple_files = true;

service PingService {
  rpc SendPing(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string reply = 1;
}