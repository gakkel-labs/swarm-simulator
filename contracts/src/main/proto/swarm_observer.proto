syntax = "proto3";

package gakkel.swarm.v1;

option java_package = "io.gakkel.swarm.contracts.v1";
option java_multiple_files = true;
option csharp_namespace = "Gakkel.Swarm.Contracts.V1";

// Coordinates in meters, NED (North/East/Down) frame.
message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

enum AgentType {
  // Proto3 requires a 0-valued entry; UNSPECIFIED is the default if the field is unset on the wire.
  // Server never emits this value (every agent has a concrete type). Clients receiving it should
  // treat it as a contract violation (skip the agent or log a warning).
  AGENT_TYPE_UNSPECIFIED = 0;
  AGENT_TYPE_EXPLORER    = 1;
  AGENT_TYPE_OPERATOR    = 2;
  AGENT_TYPE_CARRIER     = 3;
}

message AgentState {
  string    id           = 1; // UUID
  AgentType type         = 2;
  Vec3      position_xyz = 3; // meters, NED
  Vec3      velocity_mps = 4; // m/s
}

message Obstacle {
  Vec3  position_xyz = 1; // center, meters NED
  float radius_m     = 2;
}

message PredatorState {
  string id           = 1;
  Vec3   position_xyz = 2;
  Vec3   velocity_mps = 3;
}

message TargetFoundEvent {
  string agent_id      = 1;
  float  elapsed_sim_s = 2;
}

message SearchStatus {
  bool             target_placed   = 1;
  Vec3             target_position = 2; // NED; valid only when target_placed = true
  float            elapsed_sim_s   = 3; // seconds since placement; 0 when not placed
  TargetFoundEvent found_event     = 4; // absent until a drone detects the target
}

message PlaceTargetRequest {
  Vec3 position = 1; // NED, meters
}

message PlaceTargetResponse {}

message WorldState {
  int64                    timestamp_unix_ms = 1;
  repeated AgentState      agents            = 2;
  repeated Obstacle        obstacles         = 3;
  repeated PredatorState   predators         = 4;
  SearchStatus             search_status     = 5;
  float                    sensor_radius_m   = 6; // detection radius shared by all agents, meters
  float                    cohesion_spread_m = 7; // mean position spread (std dev) over last 30 ticks, metres
}

// Sent once by the client to open the stream.
message SubscribeRequest {
  string client_id = 1; // arbitrary label for server-side logging
}

service SwarmObserver {
  // Client subscribes once; server pushes WorldState frames at 20 Hz.
  rpc SubscribeWorldState(SubscribeRequest) returns (stream WorldState);
}

service SimulationControl {
  rpc PlaceTarget(PlaceTargetRequest) returns (PlaceTargetResponse);
}
