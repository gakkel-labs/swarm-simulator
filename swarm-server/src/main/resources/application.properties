# Swarm server runtime configuration (issue #62).
#
# Precedence for every setting:  environment variable  >  this file  >  built-in default.
# All keys below are COMMENTED OUT on purpose: the built-in defaults (shown as the value)
# reproduce the historical behaviour. Uncomment and edit a line to override it, or set the
# matching SWARM_* environment variable (preferred for Docker / 12-factor deployments).
#
# Environment variable equivalents are listed next to each key.

# --- Server / world ---
# swarm.port=50051                 # SWARM_PORT
# swarm.agent-count=20             # SWARM_AGENT_COUNT
# swarm.world.width=100            # SWARM_WORLD_WIDTH
# swarm.world.height=100           # SWARM_WORLD_HEIGHT
# swarm.world.depth=50             # SWARM_WORLD_DEPTH

# --- RNG seed ---
# An integer gives a fully reproducible run (same seed => same simulation).
# 'random' (or 'none') draws a fresh seed at startup and logs it so the run can be replayed.
# Unset => 42 (deterministic, the historical default).
# swarm.seed=42                    # SWARM_SEED  (integer | random | none)

# --- Boids weights / radii ---
# swarm.boids.perception-radius=25.0          # SWARM_BOIDS_PERCEPTION_RADIUS
# swarm.boids.separation-weight=1.8           # SWARM_BOIDS_SEPARATION_WEIGHT
# swarm.boids.alignment-weight=1.5            # SWARM_BOIDS_ALIGNMENT_WEIGHT
# swarm.boids.cohesion-weight=1.5             # SWARM_BOIDS_COHESION_WEIGHT
# swarm.boids.wander-weight=0.0               # SWARM_BOIDS_WANDER_WEIGHT
# swarm.boids.max-speed=5.0                   # SWARM_BOIDS_MAX_SPEED
# swarm.boids.boundary-repulsion-radius=15.0  # SWARM_BOIDS_BOUNDARY_REPULSION_RADIUS
# swarm.boids.boundary-repulsion-weight=2.0   # SWARM_BOIDS_BOUNDARY_REPULSION_WEIGHT
# swarm.boids.obstacle-avoidance-radius=8.0   # SWARM_BOIDS_OBSTACLE_AVOIDANCE_RADIUS
# swarm.boids.obstacle-avoidance-weight=4.0   # SWARM_BOIDS_OBSTACLE_AVOIDANCE_WEIGHT
# swarm.boids.threat-flee-radius=15.0         # SWARM_BOIDS_THREAT_FLEE_RADIUS
# swarm.boids.threat-flee-weight=200.0        # SWARM_BOIDS_THREAT_FLEE_WEIGHT

# --- Diagnostics thresholds ---
# swarm.diag.immobile-threshold-fraction=0.02   # SWARM_DIAG_IMMOBILE_THRESHOLD_FRACTION
# swarm.diag.frozen-threshold-fraction=0.002    # SWARM_DIAG_FROZEN_THRESHOLD_FRACTION
# swarm.diag.dispersal-limit-fraction=0.8       # SWARM_DIAG_DISPERSAL_LIMIT_FRACTION
# swarm.diag.flocking-lost-fraction=0.9         # SWARM_DIAG_FLOCKING_LOST_FRACTION
# swarm.diag.stability-tolerance=0.20           # SWARM_DIAG_STABILITY_TOLERANCE
# swarm.diag.stability-samples=3                # SWARM_DIAG_STABILITY_SAMPLES
